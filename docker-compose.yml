# Local development infrastructure.
#
# Only PostgreSQL runs in Docker. The NestJS API and the React app run
# directly on your machine through npm (see README).
#
# Credentials come from the root `.env` file (copy `.env.example`).

name: inventory-management

services:
  postgres:
    image: postgres:18-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bound to 127.0.0.1 so the database is not reachable from other machines.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<major>/,
      # so the volume is mounted at /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # Named volume: survives `docker compose down` and container re-creation.
  # It is only deleted by `docker compose down -v` or `docker volume rm`.
  postgres_data:
    name: inventory-management_postgres_data
